<!DOCTYPE html>
<html>
<head>
    <title>Cyber Security IDS</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            background-color: #f4f6f9;
        }
        h1 {
            color: #2c3e50;
        }
        .live-link {
            margin-top: 10px;
            font-size: 16px;
        }
        .live-link a {
            color: #3498db;
            font-weight: bold;
            text-decoration: none;
        }
        .live-link a:hover {
            text-decoration: underline;
        }
        .box {
            background: white;
            padding: 20px;
            margin: 20px auto;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }
        input {
            padding: 8px;
            margin: 5px;
            width: 80%;
        }
        button {
            padding: 8px 15px;
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #2980b9;
        }
        .alert {
            color: red;
            font-weight: bold;
        }
        .success {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>Cyber Security IDS Website</h1>

<div class="live-link">
    🌐 Live Server:
    <a href="https://ids-webserver.onrender.com" target="_blank">
        https://ids-webserver.onrender.com
    </a>
</div>

<div class="box">
    <h2>Login Detection</h2>
    Username: <input type="text" id="user"><br>
    Password: <input type="password" id="pass"><br>
    IP: <input type="text" id="loginIp"><br>
    <button onclick="loginCheck()">Login</button>
    <p id="loginResult"></p>
</div>

<div class="box">
    <h2>Scam Call Detection</h2>
    Phone Number: <input type="text" id="number"><br>
    IP: <input type="text" id="scamIp"><br>
    <button onclick="scamCheck()">Check</button>
    <p id="scamResult"></p>
</div>

<div class="box">
    <h3>Blocked IPs</h3>
    <ul id="blockedIPs"></ul>

    <h3>Blocked Scam Numbers</h3>
    <ul id="blockedNumbers"></ul>

    <h3>Recent Alerts</h3>
    <ul id="recentAlerts"></ul>
</div>

<script>
    let blockedIPs = {};
    let blockedNumbers = {};
    let recentAlerts = [];

    const scamBlacklist = [
        "8889988999",
        "9998887776",
        "7777770000",
        "8888888888",
        "9999999999"
    ];

    function loginCheck() {
        let pass = document.getElementById("pass").value;
        let ip = document.getElementById("loginIp").value;
        let result = document.getElementById("loginResult");

        if (pass !== "admin123") {
            blockedIPs[ip] = (blockedIPs[ip] || 0) + 1;
            let alert = "LOGIN INTRUSION from IP: " + ip + " at " + new Date();
            recentAlerts.push(alert);
            result.innerHTML = "<span class='alert'>" + alert + "</span>";
        } else {
            result.innerHTML = "<span class='success'>Login Successful</span>";
        }

        updateDisplay();
    }

    function scamCheck() {
        let number = document.getElementById("number").value;
        let ip = document.getElementById("scamIp").value;
        let result = document.getElementById("scamResult");

        if (isScamNumber(number)) {
            blockedNumbers[number] = (blockedNumbers[number] || 0) + 1;
            blockedIPs[ip] = (blockedIPs[ip] || 0) + 1;

            let alert = "SCAM DETECTED: " + number + " from IP: " + ip + " at " + new Date();
            recentAlerts.push(alert);

            result.innerHTML = "<span class='alert'>" + alert + "</span>";
        } else {
            result.innerHTML = "<span class='success'>Safe Number</span>";
        }

        updateDisplay();
    }

    function isScamNumber(number) {

        if (!/^\d{10}$/.test(number))
            return true;

        if (scamBlacklist.includes(number))
            return true;

        if (new Set(number).size === 1)
            return true;

        if (number === "1234567890" || number === "0987654321")
            return true;

        let count = {};
        for (let digit of number) {
            count[digit] = (count[digit] || 0) + 1;
            if (count[digit] >= 4)
                return true;
        }

        return false;
    }

    function updateDisplay() {

        let ipList = document.getElementById("blockedIPs");
        ipList.innerHTML = "";
        for (let ip in blockedIPs) {
            ipList.innerHTML += "<li>" + ip + " (" + blockedIPs[ip] + " times)</li>";
        }

        let numberList = document.getElementById("blockedNumbers");
        numberList.innerHTML = "";
        for (let num in blockedNumbers) {
            numberList.innerHTML += "<li>" + num + " (" + blockedNumbers[num] + " times)</li>";
        }

        let alertList = document.getElementById("recentAlerts");
        alertList.innerHTML = "";
        for (let alert of recentAlerts) {
            alertList.innerHTML += "<li>" + alert + "</li>";
        }
    }
</script>

</body>
</html>
